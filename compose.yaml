name: secthing

services:
  # One writer refreshes the persistent dependency volume before app startup.
  dependencies:
    build:
      context: .
      target: development
    command: ["npm", "ci", "--no-audit", "--no-fund"]
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    networks: [internal]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secthing}
      POSTGRES_USER: ${POSTGRES_USER:-secthing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: .
      target: development
    command: ["sh", "-c", "npm run db:migrate && npm run start:backend"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATA_DIR: ${DATA_DIR:-/app/data}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_RATE_LIMIT_PER_SECOND: ${SEC_RATE_LIMIT_PER_SECOND:-5}
      AI_MODE: ${AI_MODE:-disabled}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_CHAT_CONTEXT_WINDOW: ${AI_CHAT_CONTEXT_WINDOW:-8192}
      AI_CHAT_MAX_OUTPUT_TOKENS: ${AI_CHAT_MAX_OUTPUT_TOKENS:-1024}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      LOCAL_ONLY: ${LOCAL_ONLY:-true}
      BACKEND_PORT: 8080
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./data:/app/data
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [internal]

  worker:
    build:
      context: .
      target: development
    command: ["sh", "-c", "npm run db:migrate && npm run start:worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATA_DIR: ${DATA_DIR:-/app/data}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      SEC_RATE_LIMIT_PER_SECOND: ${SEC_RATE_LIMIT_PER_SECOND:-5}
      AI_MODE: ${AI_MODE:-disabled}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_CHAT_CONTEXT_WINDOW: ${AI_CHAT_CONTEXT_WINDOW:-8192}
      AI_CHAT_MAX_OUTPUT_TOKENS: ${AI_CHAT_MAX_OUTPUT_TOKENS:-1024}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      LOCAL_ONLY: ${LOCAL_ONLY:-true}
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./data:/app/data
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
        required: false
    networks: [internal]

  frontend:
    build:
      context: .
      target: development
    command: ["npm", "run", "dev", "--workspace=@secthing/frontend"]
    environment:
      BACKEND_API_URL: http://backend:8080
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      dependencies:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama-cpu"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [internal]

  ollama-models:
    image: ollama/ollama:latest
    profiles: ["ollama-cpu", "ollama-nvidia"]
    entrypoint: ["/bin/sh", "/bootstrap/pull-ollama-models.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODE: ${AI_MODE:-disabled}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
    volumes:
      - ./scripts/pull-ollama-models.sh:/bootstrap/pull-ollama-models.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:
  node-modules:
  ollama-data:

networks:
  internal:
    driver: bridge
